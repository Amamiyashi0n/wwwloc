name: Validate

# main 分支的推送由 deploy.yml 一并校验并部署, 这里只覆盖 PR 与手动触发, 避免重复执行。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run configure
      - run: npm run check
      - run: npm test
      - run: npm run build:check
