#!name=Apple WLOC 定位修改 (Cloudflare)
#!desc=Apple 网络定位修改 | 脚本与选点页面均由同一 Cloudflare Worker 提供: https://REPLACE-ME.workers.dev

[rewrite_local]
^https?:\/\/(?:gs-loc(?:-cn)?\.apple\.com|gsp-ssl\.ls\.apple\.com|bluedot\.is\.autonavi\.com(?:\.gds\.alibabadns\.com)?)\/clls\/wloc url script-response-body https://REPLACE-ME.workers.dev/wloc.js
^https?:\/\/gs-loc(-cn)?\.apple\.com\/wloc-settings\/save url script-echo-response https://REPLACE-ME.workers.dev/wloc-settings.js

[mitm]
hostname = gs-loc.apple.com, gs-loc-cn.apple.com, gsp-ssl.ls.apple.com, bluedot.is.autonavi.com, bluedot.is.autonavi.com.gds.alibabadns.com
